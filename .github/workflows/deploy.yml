name: Verified deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, enable, disable, signup-enable, signup-disable]
        default: inspect
        required: true
      sha:
        description: Exact current main SHA with successful push CI
        type: string
        required: true
      tree:
        description: Exact current main source tree
        type: string
        required: true
      ci_run:
        description: Successful exact-main push CI run ID
        type: string
        required: true
      previous_id:
        description: Expected current VPS deployment ID for both production aliases
        type: string
        required: true
      backend_accepted:
        description: Root accepted post-opening ES256 telemetry, consent cleanup, CORS and retention
        type: boolean
        default: false
      signup_backend_accepted:
        description: Root accepted actual production backend signup and owned cleanup
        type: boolean
        default: false
      post_open_backup_accepted:
        description: Root accepted a fresh verified backup after public opening
        type: boolean
        default: false
      backend_receipt_sha256:
        description: Root private backend acceptance receipt digest, required for enable and signup modes
        type: string
      backup_receipt_sha256:
        description: Root private fresh backup receipt digest, required for enable and signup modes
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: 0
      VERCEL_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: team_sZTFAJUNjw3uCHNZarBQgdVb
      VERCEL_PROJECT_ID: prj_O0neiglfpJG0JKq6jBYLJOE6buR4
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require the publishing credential before installing tools
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN" || { echo 'Set the VERCEL_TOKEN repository secret. Existing deployments remain active.'; exit 1; }
      - run: npm ci
      - run: npm install --global vercel@60.1.3
      - if: github.event_name != 'workflow_dispatch' || inputs.mode != 'inspect'
        run: npx playwright install --with-deps chromium
      - name: Build isolated candidate, verify, then promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/deploy.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: qa/ci/deployment.json
          if-no-files-found: ignore
          retention-days: 14

  configure-feedback-recipient:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/feedback-recipient-ops-20261008' &&
      inputs.sha == github.sha &&
      inputs.mode == 'inspect'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERCEL_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: team_sZTFAJUNjw3uCHNZarBQgdVb
      VERCEL_PROJECT_ID: prj_O0neiglfpJG0JKq6jBYLJOE6buR4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: mkdir -p qa
      - uses: actions/download-artifact@v4
        with:
          name: feedback-mail-config
          path: qa/feedback-mail-config-prior
          run-id: ${{ inputs.ci_run }}
          github-token: ${{ github.token }}
      - name: Read or update the fixed production mail recipient
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_FEEDBACK_RECIPIENT: ${{ secrets.RELEASE_FEEDBACK_RECIPIENT }}
          EXPECTED_OPERATOR_SHA: ${{ inputs.sha }}
          EXPECTED_DEPLOYMENT: ${{ inputs.previous_id }}
          ROOT_MODE: inspect
          PRIOR_RECEIPT_SHA: ${{ inputs.backend_receipt_sha256 }}
        run: node scripts/operations/configure-feedback-recipient.mjs "$ROOT_MODE" qa/feedback-mail-config-result "$EXPECTED_DEPLOYMENT" qa/feedback-mail-config-prior/result.json "$PRIOR_RECEIPT_SHA"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: feedback-mail-config
          path: qa/feedback-mail-config-result/result.json
          if-no-files-found: error
          retention-days: 7

  feedback-runtime-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/feedback-recipient-ops-20261008' &&
      inputs.sha == github.sha && inputs.mode == 'disable' &&
      inputs.previous_id == 'dpl_H8C1hCoKoWuHxEafZxh6JwV5Jun1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install pinned diagnostic CLI
        run: npm install --prefix "$RUNNER_TEMP/feedback-log-cli" --no-audit --no-fund vercel@60.1.3
      - name: Read fixed runtime window without raw log output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_OPERATOR_SHA: ${{ inputs.sha }}
          NO_UPDATE_NOTIFIER: '1'
          VERCEL_TELEMETRY_DISABLED: '1'
        run: node scripts/operations/feedback-runtime-diagnostic.mjs inspect evidence-feedback-runtime "$RUNNER_TEMP/feedback-log-cli/node_modules/vercel/dist/index.js"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: feedback-runtime-diagnostic
          path: evidence-feedback-runtime/result.json
          if-no-files-found: error
          retention-days: 7

  configure-feedback-sender:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/feedback-recipient-ops-20261008' &&
      inputs.sha == github.sha && inputs.mode == 'signup-enable' &&
      inputs.tree == '18258a81cf9b9ee34c618000066a9ab97ff5b063' &&
      inputs.previous_id == 'dpl_H8C1hCoKoWuHxEafZxh6JwV5Jun1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Materialize accepted public domain metadata and exact pins
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("domain-proof.json",Buffer.from("eyJzdGF0dXMiOiJyb290LXZlcmlmaWVkLXJlc2VuZC1zZW5kaW5nLWRvbWFpbiIsImRvbWFpbklkIjoiMWUzZTRmNmQtYjRmZi00Yjg4LThlNTUtZDIwNTY1MzI4NDA0IiwiZG9tYWluIjoidHJhamVjdG9yeS1saWZlLnJ1IiwidmVyaWZpZWQiOnRydWUsIm9wZXJhdG9yQXBwcm92ZWQiOnRydWUsImNoZWNrZWRBdFV0YyI6IjIwMjYtMTAtMDhUMTY6MDQ6MTAuMzI5MDcxNloifQ==","base64"),{mode:0o600}); fs.writeFileSync("pins.json",JSON.stringify({"mainSha":"1f7fb36374c10761cd1120b9ae85b24fab924903","tree":"18258a81cf9b9ee34c618000066a9ab97ff5b063","ciRun":"37796768330","deploymentId":"dpl_H8C1hCoKoWuHxEafZxh6JwV5Jun1","publicKeySha256":"e5c7c4fc985b7f19b25cc3c0a79e9e060acd3f0bfd5bbd0263f901abaf4ef720","domainProofSha256":"1009a09b74d28feec659b90a42d40a59c99f739132104dcd82f016e512cbfa0e"}),{mode:0o600});'
      - if: inputs.backend_accepted == true
        uses: actions/download-artifact@v4
        with:
          name: feedback-sender-config
          path: evidence-from-prior
          run-id: ${{ inputs.ci_run }}
          github-token: ${{ github.token }}
      - name: Inspect or update only the fixed production sender
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_FEEDBACK_SENDER: ${{ secrets.RELEASE_FEEDBACK_SENDER }}
          EXPECTED_OPERATOR_SHA: ${{ inputs.sha }}
          ROOT_MODE: ${{ inputs.backend_accepted && 'apply' || 'inspect' }}
          PRIOR_RECEIPT_SHA: ${{ inputs.backup_receipt_sha256 }}
        run: node scripts/operations/configure-feedback-sender.mjs "$ROOT_MODE" evidence-from-current pins.json domain-proof.json evidence-from-prior/result.json "$PRIOR_RECEIPT_SHA"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: feedback-sender-config
          path: evidence-from-current/result.json
          if-no-files-found: error
          retention-days: 7
