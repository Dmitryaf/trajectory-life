name: Verified deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, enable, disable]
        default: inspect
        required: true
      sha:
        description: Exact current main SHA with successful push CI
        type: string
        required: true
      tree:
        description: Exact current main source tree
        type: string
        required: true
      ci_run:
        description: Successful exact-main push CI run ID
        type: string
        required: true
      previous_id:
        description: Expected current VPS deployment ID for both production aliases
        type: string
        required: true
      backend_accepted:
        description: Root accepted post-opening ES256 telemetry, consent cleanup, CORS and retention
        type: boolean
        default: false
      post_open_backup_accepted:
        description: Root accepted a fresh verified backup after public opening
        type: boolean
        default: false
      backend_receipt_sha256:
        description: Root private backend acceptance receipt digest, required for enable
        type: string
      backup_receipt_sha256:
        description: Root private post-opening backup receipt digest, required for enable
        type: string
      operator_mode:
        description: Temporary owner-baseline branch only (canonical mode must remain inspect)
        type: choice
        options: [inspect, bootstrap-false]
        default: inspect
        required: true
      absence_inspection_run:
        description: Temporary operator branch only - successful same-source inspect run proving all-scope ABSENT
        type: string
      absence_receipt_sha256:
        description: Temporary operator branch only - exact raw inspect receipt SHA256 accepted by Root
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: 0
      VERCEL_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: team_sZTFAJUNjw3uCHNZarBQgdVb
      VERCEL_PROJECT_ID: prj_O0neiglfpJG0JKq6jBYLJOE6buR4
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require the publishing credential before installing tools
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN" || { echo 'Set the VERCEL_TOKEN repository secret. Existing deployments remain active.'; exit 1; }
      - run: npm ci
      - run: npm install --global vercel@60.1.3
      - if: github.event_name != 'workflow_dispatch' || inputs.mode != 'inspect'
        run: npx playwright install --with-deps chromium
      - name: Build isolated candidate, verify, then promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/deploy.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: qa/ci/deployment.json
          if-no-files-found: ignore
          retention-days: 14

  # Temporary operator branch only. Existing publish job and automatic delivery are unchanged.
  owner-baseline:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/telemetry-owner-baseline-20261008' &&
      inputs.mode == 'inspect' &&
      (inputs.operator_mode == 'inspect' || inputs.operator_mode == 'bootstrap-false')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0
      VERCEL_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: team_sZTFAJUNjw3uCHNZarBQgdVb
      VERCEL_PROJECT_ID: prj_O0neiglfpJG0JKq6jBYLJOE6buR4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@60.1.3
      - name: Inspect owner baseline or explicitly bootstrap one false flag
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPERATOR_MODE: ${{ inputs.operator_mode }}
        run: node scripts/ci/telemetry-owner-baseline.mjs "$OPERATOR_MODE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-owner-baseline
          path: qa/ci/telemetry-owner-baseline.json
          if-no-files-found: error
          retention-days: 14
